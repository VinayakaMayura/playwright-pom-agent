[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playwright-pom-agent"
version = "0.1.0"
description = "LLM-assisted Playwright Page Object Model generator with live locator verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "playwright-pom-agent contributors" }]
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
]
authors = [
  {name = "Vinayaka Mayura", email = "vinayakamayura.gg@gmail.com"},
]
maintainers = [
  {name = "Vinayaka Mayura", email = "vinayakamayura.gg@gmail.com"},
]
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
pom-agent = "playwright_pom_agent.cli:app"

[tool.pytest.ini_options]
markers = [
    "live: hits a real, network-dependent website (demo.realworld.show) - requires internet access",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playwright_pom_agent"]
